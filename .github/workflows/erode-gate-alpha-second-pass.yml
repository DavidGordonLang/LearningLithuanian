name: One-time gate cutout second alpha correction

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/erode-gate-alpha-second-pass.yml

permissions:
  contents: write

jobs:
  erode-second-pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Contract cleaned foreground alpha by exactly one more pixel
        shell: bash
        run: |
          set -euo pipefail
          p=public/assets/journey/gate-foreground-cleaned.png
          expected=7e19ed43308c838f818128d8f184ce29634479fa
          actual="$(git hash-object "$p")"
          test "$actual" = "$expected" || { echo "Unexpected gate asset SHA: $actual, expected $expected"; exit 1; }
          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageChops
          from pathlib import Path
          p=Path("public/assets/journey/gate-foreground-cleaned.png")
          image=Image.open(p).convert("RGBA")
          assert image.size == (370,538)
          before_rgb=image.convert("RGB").tobytes()
          before=image.getchannel("A")
          after=before.filter(ImageFilter.MinFilter(3))
          assert ImageChops.subtract(after,before).getbbox() is None
          assert ImageChops.difference(after,before).getbbox() is not None
          image.putalpha(after)
          assert image.convert("RGB").tobytes() == before_rgb
          image.save(p,optimize=True)
          check=Image.open(p).convert("RGBA")
          assert check.getchannel("A").tobytes() == after.tobytes()
          assert check.size == (370,538)
          print("Contracted alpha another 1px; foreground RGB and dimensions preserved.")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "fix(journey): contract gate foreground alpha by one further pixel"
          git push origin HEAD:dev
