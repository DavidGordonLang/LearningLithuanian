name: Import approved portrait Journey maps
on:
  push:
    branches: [dev]
    paths: ['.github/portrait-map-source-links.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image conversion libraries
        run: python3 -m pip install pillow pillow-avif-plugin
      - name: Create optimized map assets
        run: |
          python3 - <<'PY'
          import json, urllib.request, io
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          items=json.loads(Path('.github/portrait-map-source-links.json').read_text())
          output=Path('public/assets/journey')
          output.mkdir(parents=True,exist_ok=True)
          for key,url in items.items():
              data=urllib.request.urlopen(url,timeout=30).read()
              image=Image.open(io.BytesIO(data)).convert('RGB')
              assert image.size==(1024,1536),(key,image.size)
              file=output/f'section-1-map-{key}-portrait.avif'
              image.save(file,format='AVIF',quality=58,speed=7)
              print(key, len(data), file.stat().st_size)
          PY
      - name: Commit approved portrait game backgrounds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/journey/section-1-map-1.*-portrait.avif
          git diff --cached --quiet || (git commit -m 'assets(journey): add four approved portrait maps for DEV editor' && git push origin HEAD:dev)
